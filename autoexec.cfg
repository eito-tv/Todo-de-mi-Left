//=========================================================
//             OBJETOS CERCANOS - VERDE
//=========================================================

alias "GlowItemVerde" "cl_glow_item_r 0.0;cl_glow_item_g 1.0;cl_glow_item_b 0.0;wait 12;GlowItemBlanco"


//=========================================================
//                 INICIAR CICLO
//=========================================================

GlowItemBlanco



