//=============================================
// Left 4 Dead 2 Competitive Pack v2
// BY: EITO
//
// GUIA RAPIDA - TECLAS PERSONALIZADAS
//=============================================
// W / A / S / D = Movimiento con null movement
// .             = Cambiar distancia visual de brazos/arma
// ,             = Cambiar campo de vision general
// F8            = Abrir/cerrar consola
// J, K, L       = Mensaje de ayuda al equipo
// F9            = Mostrar/ocultar net_graph + posicion/angulo
// F10           = Desconectarse de la partida
// H             = Activar / Desactivar Haymaker
// B             = Bunny Hop
//=============================================

//----------- VISTA -----------
sensitivity 2.75
cl_viewmodelfovsurvivor 110
fov_desired 120
mat_monitorgamma_tv_enabled 0
mat_monitorgamma 1.6
mat_setvideomode 1920 1080 1
mat_setvideomode 1920 1080 0

bind "." "toggle cl_viewmodelfovsurvivor 60 100 130 180"
bind "," "toggle fov_desired 90 95 100 110 120"

// Menos movimiento visual
cl_viewbob 0

//----------- MUZZLE FLASH -----------
muzzleflash_light 0
r_flashlightmuzzleflash 0
r_flashlightmuzzleflashfov 0

//====================================
// NULL MOVEMENT SCRIPT
//====================================

bind "w" "+mfwd"
bind "s" "+mback"
bind "a" "+mleft"
bind "d" "+mright"

alias "+mfwd" "-back; +forward; alias checkfwd +forward"
alias "+mback" "-forward; +back; alias checkback +back"
alias "+mleft" "-moveright; +moveleft; alias checkleft +moveleft"
alias "+mright" "-moveleft; +moveright; alias checkright +moveright"

alias "-mfwd" "-forward; checkback; alias checkfwd none"
alias "-mback" "-back; checkfwd; alias checkback none"
alias "-mleft" "-moveleft; checkright; alias checkleft none"
alias "-mright" "-moveright; checkleft; alias checkright none"

alias "checkfwd" "none"
alias "checkback" "none"
alias "checkleft" "none"
alias "checkright" "none"
alias "none" ""

//====================================
// CONSOLA
//====================================
con_enable 1
// bind "}" "clear; status; ping; sm plugins list"
bind "f8" "toggleconsole"
sb_all_bot_game 1
vs_max_team_switches 99

//====================================
// RENDIMIENTO
//====================================

mat_queue_mode 2
cl_detail_max_sway 0
cl_ragdoll_limit 0
cl_detaildist "0"
r_dynamic "0"
r_rainparticledensity "0.35"
r_3dsky "0"
mat_force_vertexfog 0
mat_viewportscale "1"
mat_vignette_enable "0"
r_flashlightdepthtexture 0
r_waterforceexpensive 0
mat_colorcorrection 0
mat_hdr_level 0
mat_grain_enable 0
mat_local_contrast_enable 0
cl_particle_fallback_multiplier 2
cl_particle_fallback_base 3
cl_detail_avoid_force 0
cl_detail_avoid_radius 0
cl_detail_avoid_recover_speed 0

//----------- RENDIMIENTO EXTRA -----------

rope_averagelight 0
rope_wind_dist 0

r_shadows 0
r_shadows_on_renderables_enable 0
r_shadowfromanyworldlight 0

r_cheapwaterstart 1
r_cheapwaterend 1
r_WaterDrawRefraction 0
r_WaterDrawReflection 0
mat_wateroverlaysize 16

r_eyemove 0
r_teeth 0

mat_motion_blur_enabled 0
mat_postprocess_enable 0
mat_grain_scale_override 0


//----------- CROSSHAIR -----------

cl_crosshair_alpha 0
cl_crosshair_red 0
cl_crosshair_green 255
cl_crosshair_blue 0
cl_crosshair_dynamic 0
cl_crosshair_thickness 1

//----------- FPS -----------

fps_max 162

//----------- RED -----------

rate 100000
cl_cmdrate 100
cl_updaterate 100
cl_lagcompensation 1

//----------- LERP -----------

cl_interp 0.0
cl_interp_ratio 0

//----------- MOUSE -----------

m_rawinput 1
m_filter 0
m_customaccel 0

//----------- Evitar cargar el control -----------
joystick 0
joystick_force_disabled 1

//----------- AUDIO -----------

snd_mixahead 0.05
dsp_enhance_stereo 0
snd_pitchquality 1
voice_enable 1


//----------- MENSAJE AL EQUIPO -----------

bind "j" "say_team HELP, AYUDA, TIREN PARO!"
bind "k" "say_team GO GO GO GO GO GO"
bind "l" "say_team TANK TANK TANK TANK"

//----------- DESCONECTARSE -----------

bind "f10" "disconnect"

//----------- AYUDAS / POPUPS -----------
cl_autohelp 0
cl_showhelp 0
gameinstructor_enable 0
cl_clearhinthistory

//----------- LIMPIEZA VISUAL EXTRA -----------
cl_ejectbrass 0
r_drawflecks 0
func_break_max_pieces 0

//----------- HUD / INFO RAPIDA -----------
net_graph 0
cl_showfps 0
cl_showpos 0
net_graphproportionalfont 0

alias "infohud_on" "net_graph 1; cl_showpos 1; clear; status; ping; sm plugins list; alias infohud_toggle infohud_off"
alias "infohud_off" "net_graph 0; cl_showpos 0; alias infohud_toggle infohud_on"
alias "infohud_toggle" "infohud_on"

bind "F9" "infohud_toggle"

//=========================================================
//                    BUNNY HOP TOGGLE
//=========================================================

alias "jump_bind" "+jump;wait 3;-jump;wait 3;spam_jump"
alias "jump_alias" "alias spam_jump jump_bind"
alias "jump_stop" "alias spam_jump"
alias "+sj" "jump_alias;spam_jump"
alias "-sj" "jump_stop;-jump"
alias "sjtoggle" "sjtoggleon"
alias "sjtoggleon" "bind space +sj;alias sjtoggle sjtoggleoff"
alias "sjtoggleoff" "bind space +jump;alias sjtoggle sjtoggleon"

//----- Tecla B -----
bind "b" "sjtoggle"

//=============================================
// TANK HAYMAKER - MOUSE1 / TOGGLE CON H
//=============================================

// Roca + golpe
alias +doubleattack "+attack2; wait 1; +attack"
alias -doubleattack "-attack2; wait 1; -attack"

// Haymaker sin salto automático
alias +haymaker "+doubleattack"
alias -haymaker "-doubleattack"

//=============================================
// ACTIVAR / DESACTIVAR
//=============================================

// ACTIVADO:
// Mouse1 (clic izquierdo) = Haymaker
alias haymaker_on "bind MOUSE1 +haymaker; alias haymaker_toggle haymaker_off; echo HAYMAKER ACTIVADO"

// DESACTIVADO:
// Mouse1 vuelve a ataque principal normal
alias haymaker_off "bind MOUSE1 +attack; alias haymaker_toggle haymaker_on; echo HAYMAKER DESACTIVADO"

// Interruptor
alias haymaker_toggle "haymaker_on"

// H = activar/desactivar
bind "h" "haymaker_toggle"

// Empieza desactivado
haymaker_off

